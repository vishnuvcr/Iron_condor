<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIFTY Iron Condor Paper Signal</title><style>body{font-family:system-ui,sans-serif;max-width:950px;margin:32px auto;padding:0 16px;line-height:1.5}h1{margin-bottom:4px}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:12px;padding:16px}.big{font-size:1.45rem;font-weight:700}.ok{font-weight:700}.legs{width:100%;border-collapse:collapse}.legs th,.legs td{border-bottom:1px solid #eee;padding:8px;text-align:left}@media(max-width:600px){body{margin:16px auto}}</style></head>
<body><h1>NIFTY Iron Condor Paper Signal</h1><div id="status" class="muted">Loading latest signal…</div><div id="app"></div>
<script>
async function load(){const r=await fetch('signals/latest_trade_call.json?ts='+Date.now());const p=await r.json();const s=document.getElementById('status');s.textContent='Status: '+p.status+(p.generated_utc?' | generated '+p.generated_utc:'');const a=document.getElementById('app');if(p.status!=='PENDING_ENTRY'){a.innerHTML='<div class="card"><div class="big">NO SIGNAL</div><p>'+((p.reason)||'No current signal.')+'</p></div>';return;}let legs='';for(const [k,v] of Object.entries(p.legs||{})){legs+=`<tr><td>${k}</td><td>${v.strike} ${v.type}</td><td>${Number(v.reference_eod_premium).toFixed(2)}</td></tr>`}a.innerHTML=`<div class="card"><div class="big">${p.strategy}</div><p><b>Signal:</b> ${p.signal_date} &nbsp; <b>Planned entry:</b> ${p.planned_entry_date} &nbsp; <b>Expiry:</b> ${p.expiry}</p></div><div class="grid"><div class="card"><div>Reference NIFTY</div><div class="big">${Number(p.nifty_reference).toFixed(2)}</div></div><div class="card"><div>Credit</div><div class="big">${Number(p.reference_credit_points).toFixed(2)} pts</div></div><div class="card"><div>Lot / Lots</div><div class="big">${p.lot_size} / ${p.suggested_paper_lots}</div></div><div class="card"><div>Max expiry loss</div><div class="big">₹${Number(p.max_expiry_loss_total).toLocaleString('en-IN',{maximumFractionDigits:2})}</div></div></div><div class="card"><h2>Spread</h2><table class="legs"><thead><tr><th>Leg</th><th>Strike</th><th>Reference premium</th></tr></thead><tbody>${legs}</tbody></table><p><b>Breakevens:</b> ${Number(p.breakeven_lower).toFixed(2)} / ${Number(p.breakeven_upper).toFixed(2)}</p><p><b>TP debit:</b> ${Number(p.take_profit_debit).toFixed(2)} &nbsp; <b>SL debit:</b> ${Number(p.stop_loss_debit).toFixed(2)}</p><p><b>Target P&L:</b> ₹${Number(p.target_pnl_total_reference).toLocaleString('en-IN',{maximumFractionDigits:2})} &nbsp; <b>Stop P&L:</b> ₹${Number(p.stop_pnl_total_reference).toLocaleString('en-IN',{maximumFractionDigits:2})}</p></div><div class="card"><b>Important:</b> EOD premiums are reference values only. Paper-trade using actual observed bid/ask fills and record all timestamps and broker charges.</div>`}
load().catch(e=>document.getElementById('app').innerHTML='<div class="card">Signal unavailable: '+e+'</div>');
</script></body></html>
