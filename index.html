<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIFTY Iron Condor — Paper Trading Dashboard</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;background:#f8fafc}
body{max-width:1200px;margin:0 auto;padding:24px 16px;line-height:1.5}
h1{margin:0 0 4px;font-size:clamp(1.5rem,4vw,2.2rem)}
.sub{color:#64748b;margin-bottom:20px}.section{margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.big{font-size:1.42rem;font-weight:750}.label{font-size:.8rem;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.good{color:#15803d;font-weight:700}.warn{color:#b45309;font-weight:700}.bad{color:#b91c1c;font-weight:700}.muted{color:#64748b}
.legs,.trades{width:100%;border-collapse:collapse}.legs th,.legs td,.trades th,.trades td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:.88rem}
.trades th{position:sticky;top:0;background:#f8fafc}.trades tr{cursor:pointer}.trades tr:hover{background:#f8fafc}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls input{padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;flex:1;min-width:180px}.controls button,.download{padding:9px 12px;border:1px solid #cbd5e1;border-radius:9px;background:white;color:#0f172a;text-decoration:none;font:inherit}
.trade-detail{display:none;background:#f8fafc}.trade-detail.open{display:table-row}.trade-detail td{padding:14px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.detail-item{background:white;border:1px solid #e2e8f0;border-radius:9px;padding:9px}.detail-item b{display:block;font-size:.8rem;color:#64748b;margin-bottom:2px}
.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}.pagination button{padding:7px 12px;border:1px solid #cbd5e1;border-radius:8px;background:white}
pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;overflow:auto}
@media(max-width:600px){body{padding:14px}.card{padding:13px}.trades th,.trades td{font-size:.78rem;padding:7px}}
</style>
</head>
<body>
<h1>NIFTY Iron Condor Paper Trading Dashboard</h1>
<div class="sub">Prospective research signal • EOD reference prices • paper trading only</div>
<div id="status" class="card muted">Loading dashboard…</div>
<div id="app"></div>
<script>
const bust='?ts='+Date.now();
async function get(path, optional=false){
 const r=await fetch(path+bust,{cache:'no-store'});
 if(!r.ok){if(optional&&(r.status===404||r.status===410))return null;throw new Error(path+' HTTP '+r.status)}
 const text=await r.text();
 try{return JSON.parse(text)}catch(first){
  const sanitized=text.replace(/-Infinity\b/g,'null').replace(/\bInfinity\b/g,'null').replace(/\bNaN\b/g,'null');
  try{return JSON.parse(sanitized)}catch(second){throw new Error(path+' invalid JSON: '+second.message)}
 }
}
function money(x){const n=Number(x);return Number.isFinite(n)?n.toLocaleString('en-IN',{maximumFractionDigits:2}):'—';}
function num(x,d=2){const n=Number(x);return Number.isFinite(n)?n.toFixed(d):'—';}
function pct(x,d=2){const n=Number(x);return Number.isFinite(n)?(n*100).toFixed(d)+'%':'—';}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
let allTrades=[];let filtered=[];let page=1;const pageSize=20;
const labels={trade_id:'Trade ID',entry_date:'Entry date',exit_date:'Exit date',expiry:'Expiry',dte_at_entry:'DTE at entry',nifty_reference_entry:'NIFTY reference at entry',put_long_strike:'Long PE strike',put_short_strike:'Short PE strike',call_short_strike:'Short CE strike',call_long_strike:'Long CE strike',wing_width_points:'Wing width',put_long_entry_premium:'Long PE entry premium',put_short_entry_premium:'Short PE entry premium',call_short_entry_premium:'Short CE entry premium',call_long_entry_premium:'Long CE entry premium',put_long_exit_premium:'Long PE exit premium',put_short_exit_premium:'Short PE exit premium',call_short_exit_premium:'Short CE exit premium',call_long_exit_premium:'Long CE exit premium',entry_credit_points:'Entry credit (points)',entry_credit_value_per_lot:'Entry credit (₹/lot)',lower_breakeven:'Lower breakeven',upper_breakeven:'Upper breakeven',take_profit_credit_pct:'Take profit (% credit)',stop_loss_credit_multiple:'Stop loss (× credit)',take_profit_debit:'Take-profit debit',stop_loss_debit:'Stop-loss debit',lot_size:'Lot size',gross_pnl:'Gross P&L',modeled_costs:'Modeled costs',net_pnl:'Net P&L',return_on_capital:'Return on capital',return_on_max_loss:'Return on max loss',max_expiry_loss_points:'Max expiry loss (points)',max_expiry_loss:'Max expiry loss (₹)',exit_reason:'Exit reason'};
function prettyValue(k,v){if(v===null||v===undefined||v==='')return '—';if(k.includes('date'))return esc(v);if(k.includes('pct')||k==='return_on_capital'||k==='return_on_max_loss')return pct(v,2);if(['gross_pnl','modeled_costs','net_pnl','max_expiry_loss','entry_credit_value_per_lot'].includes(k))return '₹'+money(v);if(k.endsWith('_premium')||k.endsWith('_strike')||k.includes('breakeven')||k.includes('debit')||k==='entry_credit_points'||k==='wing_width_points'||k==='nifty_reference_entry'||k==='max_expiry_loss_points')return num(v,2);return esc(v);}
function detailHtml(t){let s='<div class="detail-grid">';for(const [k,v] of Object.entries(t)){s+=`<div class="detail-item"><b>${esc(labels[k]||k)}</b>${prettyValue(k,v)}</div>`}return s+'</div>';}
function renderTrades(){const body=document.getElementById('tradeBody');const start=(page-1)*pageSize;const rows=filtered.slice(start,start+pageSize);body.innerHTML='';rows.forEach((t,i)=>{const idx=start+i;const tr=document.createElement('tr');tr.innerHTML=`<td>${idx+1}</td><td>${esc(t.entry_date)}</td><td>${esc(t.exit_date)}</td><td>${esc(t.expiry)}</td><td>${esc(t.put_short_strike)} PE / ${esc(t.call_short_strike)} CE</td><td>${money(t.entry_credit_points)}</td><td>${esc(t.lot_size)}</td><td class="${Number(t.net_pnl)>=0?'good':'bad'}">₹${money(t.net_pnl)}</td><td>${esc(t.exit_reason)}</td>`;tr.onclick=()=>document.getElementById('detail-'+idx).classList.toggle('open');body.appendChild(tr);const dr=document.createElement('tr');dr.id='detail-'+idx;dr.className='trade-detail';dr.innerHTML=`<td colspan="9"><strong>Complete trade details</strong><div style="margin-top:10px">${detailHtml(t)}</div></td>`;body.appendChild(dr)});document.getElementById('pageInfo').textContent=filtered.length?`Showing ${start+1}–${Math.min(start+pageSize,filtered.length)} of ${filtered.length}`:'No trades';document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=Math.ceil(filtered.length/pageSize)||!filtered.length;}
function filterTrades(){const q=document.getElementById('search').value.trim().toLowerCase();filtered=allTrades.filter(t=>!q||Object.values(t).some(v=>String(v??'').toLowerCase().includes(q)));page=1;renderTrades();}
async function load(){try{
 const [signal,params,oos,trades]=await Promise.all([get('signals/latest_trade_call.json'),get('data/research/selected_parameters.json'),get('data/research/oos_validation.json',true),get('data/research/oos_trade_history_detailed.json',true)]);
 document.getElementById('status').innerHTML=`<div class="label">Current production status</div><div class="big">${esc(signal.status)}</div><div class="muted">Latest data: ${esc(signal.latest_data_date||'—')}</div>`;
 const app=document.getElementById('app');let html='';
 html+=`<div class="section grid"><div class="card"><div class="label">Selected distance</div><div class="big">${num(params.distance*100,2)}%</div></div><div class="card"><div class="label">Wing width</div><div class="big">${num(params.width,0)} pts</div></div><div class="card"><div class="label">Take profit</div><div class="big">${num(params.take_profit*100,0)}% credit</div></div><div class="card"><div class="label">Stop loss</div><div class="big">${num(params.stop_loss,2)}× credit</div></div></div>`;
 html+=`<div class="section card"><div class="label">Full-history production training</div><p>Trades: <b>${money(params.trades)}</b> · In-sample win rate: <b>${pct(params.win_rate,2)}</b> · In-sample cumulative return: <b>${pct(params.total_return,2)}</b></p><p class="muted">This is the live model's full-history training snapshot, not OOS evidence.</p></div>`;
 if(signal.status==='PENDING_ENTRY'){let rows='';for(const [k,v] of Object.entries(signal.legs||{})){rows+=`<tr><td>${esc(k)}</td><td>${v.strike} ${v.type}</td><td>${num(v.reference_eod_premium)}</td></tr>`}html+=`<div class="section card"><h2>Current prospective trade call</h2><p><b>Signal:</b> ${signal.signal_date} · <b>Planned entry:</b> ${signal.planned_entry_date} · <b>Expiry:</b> ${signal.expiry}</p><div class="grid"><div><div class="label">NIFTY reference</div><div class="big">${num(signal.nifty_reference)}</div></div><div><div class="label">Credit</div><div class="big">${num(signal.reference_credit_points)} pts</div></div><div><div class="label">Lot / lots</div><div class="big">${signal.lot_size} / ${signal.suggested_paper_lots}</div></div><div><div class="label">Max expiry loss</div><div class="big">₹${money(signal.max_expiry_loss_total)}</div></div></div><h3>Four-leg spread</h3><table class="legs"><thead><tr><th>Leg</th><th>Strike</th><th>Reference premium</th></tr></thead><tbody>${rows}</tbody></table><p><b>Breakevens:</b> ${num(signal.breakeven_lower)} / ${num(signal.breakeven_upper)} · <b>TP debit:</b> ${num(signal.take_profit_debit)} · <b>SL debit:</b> ${num(signal.stop_loss_debit)}</p><p><b>Target P&amp;L:</b> ₹${money(signal.target_pnl_total_reference)} · <b>Stop P&amp;L:</b> ₹${money(signal.stop_pnl_total_reference)}</p></div>`}else{html+=`<div class="section card"><div class="big">No new trade call</div><p>${esc(signal.reason||'No current signal.')}</p></div>`}
 html+=`<div class="section card"><h2>Historical OOS validation</h2>`;
 if(oos){html+=`<p><b>${esc(oos.method)}</b> · Train: ${esc(oos.train_start)} → ${esc(oos.train_end)} · OOS: ${esc(oos.oos_start)} → ${esc(oos.oos_end)}</p><div class="grid"><div><div class="label">OOS trades</div><div class="big">${money(oos.oos.trades)}</div></div><div><div class="label">OOS win rate</div><div class="big">${pct(oos.oos.win_rate,2)}</div></div><div><div class="label">OOS cumulative return</div><div class="big">${pct(oos.oos.total_return,2)}</div></div><div><div class="label">OOS net P&amp;L</div><div class="big">₹${money(oos.oos.net_pnl)}</div></div><div><div class="label">Worst trade</div><div class="big">₹${money(oos.oos.worst_trade)}</div></div></div><p class="muted">OOS uses the historical EOD backtest mechanics. It is separate from the live full-history model and from execution/path-risk validation.</p>`}else{html+='<p class="warn">OOS validation file is not yet available.</p>'}html+='</div>';
 if(trades&&Array.isArray(trades)){allTrades=trades;filtered=trades;html+=`<div class="section card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin-bottom:4px">All OOS trades — complete ledger</h2><div class="muted">Tap any row to expand every available field for that trade.</div></div><div class="controls"><input id="search" placeholder="Search date, strike, P&amp;L, reason…"><a class="download" href="data/research/oos_trade_history_detailed.csv" download>Download CSV</a><a class="download" href="data/research/oos_trade_history_detailed.json" download>Download JSON</a></div></div><div style="overflow:auto;margin-top:12px"><table class="trades"><thead><tr><th>#</th><th>Entry</th><th>Exit</th><th>Expiry</th><th>Short strikes</th><th>Credit</th><th>Lot</th><th>Net P&amp;L</th><th>Exit</th></tr></thead><tbody id="tradeBody"></tbody></table></div><div class="pagination"><button id="prev">Previous</button><span id="pageInfo"></span><button id="next">Next</button></div></div>`}else{html+='<div class="section card"><p class="warn">Detailed OOS trade ledger is not yet available.</p></div>'}
 html+=`<div class="section card"><b>Paper-trading rule:</b> EOD option prices are reference values only. Record actual observed bid/ask entry, timestamps, quantity, charges, and exit details separately.</div>`;
 app.innerHTML=html;if(trades&&Array.isArray(trades)){document.getElementById('search').addEventListener('input',filterTrades);document.getElementById('prev').onclick=()=>{page--;renderTrades()};document.getElementById('next').onclick=()=>{page++;renderTrades()};renderTrades();}
}catch(e){document.getElementById('status').innerHTML='<div class="bad">Dashboard error</div><div>'+esc(e.message)+'</div>'}}
load();
</script>
</body>
</html>
