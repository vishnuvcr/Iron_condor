<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIFTY Iron Condor V2 — Paper Trading</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:1200px;margin:auto;padding:20px;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px rgba(15,23,42,.04)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.label{font-size:.78rem;color:#64748b;text-transform:uppercase}.big{font-size:1.35rem;font-weight:750}.good{color:#15803d}.warn{color:#b45309}.bad{color:#b91c1c}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:.86rem}a{padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;text-decoration:none;color:#0f172a}.muted{color:#64748b}.small{font-size:.86rem}</style></head>
<body><h1>NIFTY Iron Condor V2</h1><div class="muted">Prospective paper trading • independent V2 pipeline • immutable paper trade book</div><p><a href="../">← V1 dashboard</a></p><div id="status" class="card">Loading…</div><div id="app"></div>
<script>
const q='?ts='+Date.now();
async function get(p){const r=await fetch(p+q,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()}
const n=x=>Number.isFinite(Number(x))?Number(x).toFixed(2):'—'; const money=x=>Number.isFinite(Number(x))?'₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:2}):'—'; const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{const [m,s,b]=await Promise.all([get('data/model_snapshot.json',true),get('signal/latest_trade_call.json',true),get('../paper/v2/trade_book.json',true)]);if(!m){document.getElementById('status').innerHTML='<div class="warn">V2 has not run yet.</div>';return;}document.getElementById('status').innerHTML=`<div class="label">V2 model status</div><div class="big">Full-history trained through ${esc(m.training_end)}</div><div class="small">Training trades: <b>${m.training_trades}</b> · In-sample win rate: <b>${n(m.training_win_rate*100)}%</b> · Training return: <b>${n(m.training_return*100)}%</b></div>`;
let h=`<div class="card"><h2>Selected production parameters</h2><div class="grid"><div><div class="label">Entry day</div><div class="big">Thursday</div></div><div><div class="label">Distance</div><div class="big">${n(m.selected_parameters.distance*100)}%</div></div><div><div class="label">Wing</div><div class="big">${m.selected_parameters.width} pts</div></div><div><div class="label">TP</div><div class="big">${n(m.selected_parameters.take_profit*100)}%</div></div><div><div class="label">SL</div><div class="big">${n(m.selected_parameters.stop_loss)}×</div></div><div><div class="label">Min credit</div><div class="big">${n(m.selected_parameters.minimum_credit)} pts</div></div></div></div>`;
if(s&&s.status==='PENDING_ENTRY'){h+=`<div class="card"><h2>Latest V2 trade call</h2><p><b>${esc(s.signal_id)}</b> · Signal ${esc(s.signal_date)} · Planned entry observation ${esc(s.planned_entry_date)} · Expiry ${esc(s.expiry)}</p><p>${esc(s.entry_condition)}</p><div class="grid"><div><div class="label">NIFTY reference</div><div class="big">${n(s.nifty_reference)}</div></div><div><div class="label">Reference credit</div><div class="big">${n(s.reference_credit_points)} pts</div></div><div><div class="label">Lot / lots</div><div class="big">${s.lot_size} / ${s.suggested_paper_lots}</div></div><div><div class="label">Max expiry loss</div><div class="big">${money(s.max_expiry_loss_total)}</div></div></div><h3>Four legs</h3><table><tr><th>Leg</th><th>Strike</th><th>Reference premium</th></tr>${Object.entries(s.legs).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.strike} ${v.type}</td><td>${n(v.reference_eod_premium)}</td></tr>`).join('')}</table></div>`}else{h+=`<div class="card"><div class="big">No new Thursday signal in the current dataset</div><p class="muted">The previous V2 call is preserved rather than overwritten.</p></div>`}
h+=`<div class="card"><h2>Prospective paper trade book</h2><p class="muted">Backtest/OOS trades are excluded. Signal snapshots are immutable; entries and outcomes are recorded as separate events.</p><table><tr><th>Signal</th><th>Signal date</th><th>Status</th><th>Outcome</th><th>Net P&amp;L</th><th>Reason</th></tr>${((b&&b.trades)||[]).map(t=>{const o=t.outcome||{};return `<tr><td>${esc(t.signal_id)}</td><td>${esc(t.call_snapshot.signal_date)}</td><td>${esc(t.paper_status)}</td><td>${esc(o.exit_date||'—')}</td><td class="${Number(o.net_pnl)>=0?'good':Number(o.net_pnl)<0?'bad':''}">${o.net_pnl==null?'—':money(o.net_pnl)}</td><td>${esc(o.reason||'—')}</td></tr>`}).join('')}</table></div>`;
h+=`<div class="card small"><b>Execution note:</b> EOD prices are research reference values. Record actual bid/ask, timestamps, fills, quantities and contract-note charges separately. This page does not import historical OOS trades into the prospective ledger.</div>`;document.getElementById('app').innerHTML=h}catch(e){document.getElementById('status').innerHTML='<div class="bad"><b>V2 dashboard error</b><br>'+esc(e.message)+'</div>'}}
load();
</script></body></html>
