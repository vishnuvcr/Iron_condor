name: NIFTY Iron Condor V1 Paper Signal

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 2'   # Tuesday 17:00 IST, after NSE close

permissions:
  contents: write

# V1 and V2 use the same repository-level paper-trading lock so they cannot
# execute simultaneously. A manually triggered V2 waits rather than cancelling V1.
concurrency:
  group: iron-condor-paper-production
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout V1
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download current NSE history
        env:
          NSE_HISTORY_START: '2015-01-01'
          NSE_HISTORY_WORKERS: '5'
        run: python scripts/download_nifty_history.py

      - name: Train V1 on all available history and generate signal
        run: python scripts/generate_signal.py

      - name: Run chronological V1 OOS validation
        run: python scripts/oos_validation.py

      - name: Update immutable V1 prospective paper book
        run: python scripts/maintain_paper_book.py --version v1 --signal signals/latest_trade_call.json

      - name: Validate V1 outputs
        run: |
          test -f signals/latest_trade_call.json
          test -f signals/latest_trade_call.md
          test -f data/research/selected_parameters.json
          test -f data/research/oos_validation.json
          test -f data/research/oos_trade_history.csv
          test -f paper/v1/events.jsonl
          test -f paper/v1/trade_book.json
          python - <<'PY'
          import json
          p=json.load(open('signals/latest_trade_call.json'))
          assert p.get('status') in {'PENDING_ENTRY','NO_SIGNAL'}
          o=json.load(open('data/research/oos_validation.json'))
          assert o.get('method') == 'Chronological 70/30 holdout'
          assert o.get('oos',{}).get('trades',0) > 0
          print('Signal status:', p.get('status'))
          print('OOS trades:', o['oos']['trades'])
          print('OOS win rate:', o['oos']['win_rate'])
          print('OOS return:', o['oos']['total_return'])
          PY

      - name: Commit V1 page data and paper book only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signals data/research paper/v1
          git diff --cached --quiet || git commit -m "Update V1 prospective signal and paper book"
          git push

      - name: Upload V1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iron-condor-v1-paper-signal
          path: |
            signals/latest_trade_call.md
            signals/latest_trade_call.json
            data/research/selected_parameters.json
            data/research/parameter_leaderboard.csv
            data/research/oos_validation.json
            data/research/oos_train_parameter_leaderboard.csv
            data/research/oos_trade_history.csv
            paper/v1/events.jsonl
            paper/v1/trade_book.json
            data/cache/manifest.json
          if-no-files-found: ignore
